name: Scene pipeline CPU checks
on: [push, pull_request]
jobs:
  geometry-and-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install "numpy<2" scipy "opencv-python-headless<4.12"
      - run: python -m unittest discover -s tests -p test_scene_pipeline.py -v
